version: "3.8"
services:
  office-proxy:
    image: nginx:1.28-alpine
    networks: [traefik-public, rsms-office]
    configs:
      - source: office-nginx
        target: /etc/nginx/conf.d/default.conf
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      labels:
        traefik.enable: "true"
        traefik.constraint-label: traefik-public
        traefik.docker.network: traefik-public
        traefik.http.routers.rsms-office.rule: Host(`office.rsms.openzoo.net`)
        traefik.http.routers.rsms-office.entrypoints: https
        traefik.http.routers.rsms-office.tls: "true"
        traefik.http.routers.rsms-office.tls.certresolver: lehttp
        traefik.http.routers.rsms-office.service: rsms-office
        traefik.http.services.rsms-office.loadbalancer.server.port: "80"
        traefik.http.routers.rsms-office-http.rule: Host(`office.rsms.openzoo.net`)
        traefik.http.routers.rsms-office-http.entrypoints: http
        traefik.http.routers.rsms-office-http.middlewares: rsms-office-https
        traefik.http.routers.rsms-office-http.service: rsms-office
        traefik.http.middlewares.rsms-office-https.redirectscheme.scheme: https
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
configs:
  office-nginx:
    name: rsms-office-nginx-${RSMS_OFFICE_CONFIG_REV:-v1}
    file: ./office-nginx.conf
networks:
  traefik-public:
    external: true
  rsms-office:
    external: true
