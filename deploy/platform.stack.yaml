version: "3.8"
services:
  platform:
    image: ${RSMS_PLATFORM_IMAGE:-rsms-platform:production}
    env_file: ../.env
    environment:
      STANDARD_ENV: production
      STANDARD_DB: /app/data/unused-local.db
    networks: [rsms-office]
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=8)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      update_config: {parallelism: 1, order: stop-first, failure_action: rollback}
      resources:
        limits: {memory: 1G}
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  gateway:
    image: nginx:1.28-alpine
    networks: [traefik-public, rsms-office]
    configs:
      - source: platform-nginx
        target: /etc/nginx/conf.d/default.conf
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      labels:
        traefik.enable: "true"
        traefik.constraint-label: traefik-public
        traefik.docker.network: traefik-public
        traefik.http.routers.rsms.rule: Host(`rsms.openzoo.net`)
        traefik.http.routers.rsms.entrypoints: https
        traefik.http.routers.rsms.tls: "true"
        traefik.http.routers.rsms.tls.certresolver: le
        traefik.http.routers.rsms.service: rsms
        traefik.http.services.rsms.loadbalancer.server.port: "80"
        traefik.http.routers.rsms-http.rule: Host(`rsms.openzoo.net`)
        traefik.http.routers.rsms-http.entrypoints: http
        traefik.http.routers.rsms-http.middlewares: rsms-https
        traefik.http.routers.rsms-http.service: rsms
        traefik.http.middlewares.rsms-https.redirectscheme.scheme: https
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
configs:
  platform-nginx:
    name: rsms-platform-nginx-${RSMS_PLATFORM_CONFIG_REV:-v1}
    file: ./platform-nginx.conf
networks:
  traefik-public:
    external: true
  rsms-office:
    external: true
