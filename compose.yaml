services:
  platform:
    build: .
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      STANDARD_DB: /app/data/platform.db
      STANDARD_ADMIN_PASSWORD: ${STANDARD_ADMIN_PASSWORD:?Set STANDARD_ADMIN_PASSWORD in .env}
      ONLYOFFICE_PUBLIC_URL: ${ONLYOFFICE_PUBLIC_URL:?Set browser-accessible URL in .env}
      ONLYOFFICE_INTERNAL_URL: http://documentserver
      ONLYOFFICE_PLATFORM_URL: http://platform:8765
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?Set a random JWT secret in .env}
      TENCENTCLOUD_SECRET_ID: ${TENCENTCLOUD_SECRET_ID:-}
      TENCENTCLOUD_SECRET_KEY: ${TENCENTCLOUD_SECRET_KEY:-}
      TENCENT_CAPTCHA_APP_ID: ${TENCENT_CAPTCHA_APP_ID:-}
      TENCENT_CAPTCHA_SECRET_KEY: ${TENCENT_CAPTCHA_SECRET_KEY:-}
      TENCENT_SMS_SECRET_ID: ${TENCENT_SMS_SECRET_ID:-}
      TENCENT_SMS_SECRET_KEY: ${TENCENT_SMS_SECRET_KEY:-}
      TENCENT_SMS_SDK_APP_ID: ${TENCENT_SMS_SDK_APP_ID:-}
      TENCENT_SMS_SIGN_NAME: ${TENCENT_SMS_SIGN_NAME:-}
      TENCENT_SMS_TEMPLATE_ID: ${TENCENT_SMS_TEMPLATE_ID:-}
      TENCENT_SMS_REGION: ${TENCENT_SMS_REGION:-ap-guangzhou}
      TENCENT_SMS_ENDPOINT: ${TENCENT_SMS_ENDPOINT:-sms.tencentcloudapi.com}
    volumes:
      - platform-data:/app/data
  documentserver:
    image: onlyoffice/documentserver:10.0
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?Set a random JWT secret in .env}
      JWT_HEADER: Authorization
      # Required for this isolated private compose network; do not expose to untrusted tenants.
      ALLOW_PRIVATE_IP_ADDRESS: "true"
    volumes:
      - office-data:/var/www/onlyoffice/Data
      - office-logs:/var/log/onlyoffice
      - office-state:/var/lib/onlyoffice
    shm_size: 1gb
volumes:
  platform-data:
  office-data:
  office-logs:
  office-state:
